name: Liquibase Deployment to Databricks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Liquibase
        run: |
          wget -q -O - https://repo.liquibase.com/liquibase.asc | gpg --dearmor -o /usr/share/keyrings/liquibase-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/liquibase-keyring.gpg] https://repo.liquibase.com/ debian main" | sudo tee /etc/apt/sources.list.d/liquibase.list
          sudo apt-get update
          sudo apt-get install -y liquibase

      - name: Run Liquibase Update
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          liquibase update --defaults-file=liquibase.properties