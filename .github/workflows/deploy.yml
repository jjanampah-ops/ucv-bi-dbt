name: CD - Deploy Database Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v2
        with:
          version: '4.25.0'
          edition: 'community'

      - name: Install Databricks extensions
        run: |
          liquibase lpm add liquibase-databricks --auto-accept
          liquibase lpm add databricks-jdbc --auto-accept

      - name: Validate changelog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog.yml \
            --url="jdbc:databricks://${{ env.DATABRICKS_HOST }}:443/default;transportMode=http;ssl=1;httpPath=${{ env.DATABRICKS_HTTP_PATH }};AuthMech=3;UID=token;PWD=${{ env.DATABRICKS_TOKEN }}" \
            --username=token \
            --password="${{ env.DATABRICKS_TOKEN }}" \
            validate

      - name: Deploy pending changesets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog.yml \
            --url="jdbc:databricks://${{ env.DATABRICKS_HOST }}:443/default;transportMode=http;ssl=1;httpPath=${{ env.DATABRICKS_HTTP_PATH }};AuthMech=3;UID=token;PWD=${{ env.DATABRICKS_TOKEN }}" \
            --username=token \
            --password="${{ env.DATABRICKS_TOKEN }}" \
            update

      - name: Confirm database status
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog.yml \
            --url="jdbc:databricks://${{ env.DATABRICKS_HOST }}:443/default;transportMode=http;ssl=1;httpPath=${{ env.DATABRICKS_HTTP_PATH }};AuthMech=3;UID=token;PWD=${{ env.DATABRICKS_TOKEN }}" \
            --username=token \
            --password="${{ env.DATABRICKS_TOKEN }}" \
            status --verbose